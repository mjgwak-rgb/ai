<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 모음</title>
<style>
  :root { --bg: #f4f5f7; --card: #fff; --text: #1d2129; --muted: #6b7280; --line: #e5e7eb; --accent: #2f6fed; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --card: #1b1e25; --text: #e8eaed; --muted: #9aa0a6; --line: #2c313a; --accent: #6f9cf5; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  a.card {
    display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .icon { font-size: 32px; }
  .card h2 { font-size: 18px; margin: 8px 0 4px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>프로젝트 모음</h1>
  <p class="sub">만든 프로젝트를 모아 둔 곳이에요.</p>
  <div class="list">
    <a class="card" href="lotto/">
      <div class="icon">🎱</div>
      <h2>로또 번호 생성기</h2>
      <p>역대 당첨번호 통계를 반영한 로또 6/45 번호 생성과 당첨 확인</p>
    </a>
  </div>
</main>
</body>
</html>
