<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로또 번호 생성기</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1d2129;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2f6fed;
    --include: #16a34a;
    --exclude: #dc2626;
    --b1: #fbc400; --b2: #69c8f2; --b3: #ff7272; --b4: #aaaaaa; --b5: #b0d840;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1b1e25; --text: #e8eaed; --muted: #9aa0a6; --line: #2c313a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", system-ui, -apple-system, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 16px; margin: 0 0 12px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  label { color: var(--muted); font-size: 14px; }
  select, button {
    font: inherit; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); padding: 10px 14px; cursor: pointer;
  }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700;
    padding: 12px 22px; font-size: 16px;
  }
  button.primary:active { transform: translateY(1px); }
  button.ghost { background: transparent; }
  .spacer { flex: 1; }

  .grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
  .cell {
    aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; cursor: pointer; user-select: none;
    background: var(--card); color: var(--text); padding: 0;
  }
  .cell.inc { background: var(--include); border-color: var(--include); color: #fff; }
  .cell.exc { background: transparent; border-color: var(--exclude); color: var(--exclude); text-decoration: line-through; opacity: .7; }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

  .game {
    display: flex; align-items: center; gap: 10px; padding: 10px 0;
    border-bottom: 1px dashed var(--line);
  }
  .game:last-child { border-bottom: 0; }
  .tag { width: 28px; color: var(--muted); font-weight: 700; }
  .balls { display: flex; gap: 8px; flex-wrap: wrap; }
  .ball {
    width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #fff; font-size: 17px;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    box-shadow: inset -4px -4px 8px rgba(0,0,0,.15), inset 3px 3px 6px rgba(255,255,255,.35);
    animation: pop .35s ease-out both;
  }
  .ball.fixed { outline: 3px solid var(--include); outline-offset: 2px; }
  .ball.sm { width: 30px; height: 30px; font-size: 12px; animation: none; }
  @keyframes pop { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  .c1 { background: var(--b1); } .c2 { background: var(--b2); } .c3 { background: var(--b3); }
  .c4 { background: var(--b4); } .c5 { background: var(--b5); }

  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .hist-item { display: flex; gap: 10px; align-items: center; padding: 6px 0; flex-wrap: wrap; }
  .hist-time { color: var(--muted); font-size: 12px; width: 100%; margin-top: 8px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #111; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .note { color: var(--muted); font-size: 12px; margin-top: 24px; text-align: center; }

  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(7, 1fr); }
    .ball { width: 38px; height: 38px; font-size: 15px; }
    .balls { gap: 6px; }
  }
</style>
</head>
<body>
<main>
  <h1>🎱 로또 6/45 번호 생성기</h1>
  <p class="sub">1~45 중 중복 없이 6개 번호를 무작위로 뽑습니다.</p>

  <section class="card">
    <div class="row">
      <label for="count">게임 수</label>
      <select id="count">
        <option>1</option><option>2</option><option>3</option><option>4</option>
        <option selected>5</option><option>10</option>
      </select>
      <span class="spacer"></span>
      <button class="primary" id="gen">번호 생성</button>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <h2 style="margin:0">생성 결과</h2>
      <span class="spacer"></span>
      <button class="ghost" id="copy">복사</button>
    </div>
    <div id="result"><div class="empty">‘번호 생성’ 버튼을 눌러보세요</div></div>
  </section>

  <section class="card">
    <div class="row" style="margin-bottom:12px">
      <h2 style="margin:0">번호 고정 / 제외 <span style="font-weight:400;color:var(--muted);font-size:13px">(선택)</span></h2>
      <span class="spacer"></span>
      <button class="ghost" id="reset">초기화</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span>번호를 누를 때마다: 기본 → <span class="dot" style="background:var(--include)"></span>고정(최대 5개) → <span class="dot" style="border:2px solid var(--exclude)"></span>제외 → 기본</span>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <h2 style="margin:0">최근 기록</h2>
      <span class="spacer"></span>
      <button class="ghost" id="clearHist">기록 지우기</button>
    </div>
    <div id="history"></div>
  </section>

  <p class="note">재미로만 이용하세요. 모든 번호 조합의 당첨 확률은 동일합니다 (1등 1/8,145,060).</p>
</main>
<div class="toast" id="toast"></div>

<script>
  const MAX_INCLUDE = 5;
  const HISTORY_KEY = 'lotto-history-v1';
  const state = new Array(46).fill(0); // 0: 기본, 1: 고정, 2: 제외
  let lastGames = [];

  const $ = (id) => document.getElementById(id);
  const colorClass = (n) => 'c' + Math.min(5, Math.ceil(n / 10));

  // 암호학적으로 안전한 난수로 [0, max) 정수 생성 (모듈로 편향 제거)
  function randInt(max) {
    const buf = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / max) * max;
    let x;
    do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
    return x % max;
  }

  function generateGame(include, exclude) {
    const picked = new Set(include);
    const pool = [];
    for (let n = 1; n <= 45; n++) if (!picked.has(n) && !exclude.has(n)) pool.push(n);
    // Fisher–Yates 부분 셔플
    for (let i = 0; i < 6 - picked.size; i++) {
      const j = i + randInt(pool.length - i);
      [pool[i], pool[j]] = [pool[j], pool[i]];
      picked.add(pool[i]);
    }
    return [...picked].sort((a, b) => a - b);
  }

  function ballHTML(n, extra = '', delay = 0) {
    return `<div class="ball ${colorClass(n)} ${extra}" style="animation-delay:${delay}ms">${n}</div>`;
  }

  function render(games, include) {
    $('result').innerHTML = games.map((g, gi) => `
      <div class="game">
        <div class="tag">${String.fromCharCode(65 + gi)}</div>
        <div class="balls">${g.map((n, i) => ballHTML(n, include.includes(n) ? 'fixed' : '', gi * 120 + i * 60)).join('')}</div>
      </div>`).join('');
  }

  function generate() {
    const include = [], exclude = new Set();
    for (let n = 1; n <= 45; n++) {
      if (state[n] === 1) include.push(n);
      if (state[n] === 2) exclude.add(n);
    }
    if (45 - exclude.size < 6) { toast('제외 번호가 너무 많아요 (최소 6개는 남겨야 해요)'); return; }
    const count = Number($('count').value);
    lastGames = Array.from({ length: count }, () => generateGame(include, exclude));
    render(lastGames, include);
    saveHistory(lastGames);
  }

  function renderGrid() {
    $('grid').innerHTML = '';
    for (let n = 1; n <= 45; n++) {
      const b = document.createElement('button');
      b.className = 'cell' + (state[n] === 1 ? ' inc' : state[n] === 2 ? ' exc' : '');
      b.textContent = n;
      b.title = ['기본', '고정', '제외'][state[n]];
      b.onclick = () => {
        let next = (state[n] + 1) % 3;
        if (next === 1 && state.filter(s => s === 1).length >= MAX_INCLUDE) {
          toast(`고정 번호는 최대 ${MAX_INCLUDE}개까지예요`);
          next = 2;
        }
        if (next === 2 && state.filter(s => s === 2).length >= 39) {
          toast('제외 번호는 최대 39개까지예요');
          next = 0;
        }
        state[n] = next;
        renderGrid();
      };
      $('grid').appendChild(b);
    }
  }

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; }
  }
  function saveHistory(games) {
    const hist = loadHistory();
    hist.unshift({ t: Date.now(), games });
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(hist.slice(0, 10))); } catch {}
    renderHistory();
  }
  function renderHistory() {
    const hist = loadHistory();
    if (!hist.length) { $('history').innerHTML = '<div class="empty">아직 기록이 없어요</div>'; return; }
    $('history').innerHTML = hist.map(h => `
      <div class="hist-time">${new Date(h.t).toLocaleString('ko-KR')}</div>
      ${h.games.map(g => `<div class="hist-item"><div class="balls">${g.map(n => ballHTML(n, 'sm')).join('')}</div></div>`).join('')}
    `).join('');
  }

  let toastTimer;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }

  $('gen').onclick = generate;
  $('reset').onclick = () => { state.fill(0); renderGrid(); };
  $('clearHist').onclick = () => { try { localStorage.removeItem(HISTORY_KEY); } catch {} renderHistory(); };
  $('copy').onclick = async () => {
    if (!lastGames.length) { toast('먼저 번호를 생성해 주세요'); return; }
    const text = lastGames.map((g, i) => `${String.fromCharCode(65 + i)}: ${g.join(', ')}`).join('\n');
    try { await navigator.clipboard.writeText(text); toast('복사했어요'); }
    catch { toast('복사에 실패했어요'); }
  };
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target === document.body) { e.preventDefault(); generate(); }
  });

  renderGrid();
  renderHistory();
</script>
</body>
</html>
